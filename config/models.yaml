# Конфигурация моделей для пайплайна. Ключи/секреты — в .env, не здесь.
models:
  chatgpt:
    provider: openai
    # GPT-6 Astra стоит $10/$50 за 1M токенов (вход/выход) — для студенческого бюджета
    # неоправданно дорого на 750 запросов. Задание не требует именно GPT-6 (в табличке
    # ПДФ "GPT-6" — просто пример названия колонки), поэтому берём gpt-4o-mini:
    # $0.15/$0.60 за 1M — ~80x дешевле, тот же провайдер (OpenAI), тот же ключ.
    model_name: gpt-4o-mini
    temperature: 0.7
  deepseek:
    provider: deepseek
    model_name: deepseek-chat
    temperature: 0.7
  qwen:
    provider: qwen
    # Ключ QWEN_API_KEY — от OpenRouter (sk-or-v1-...), не от DashScope напрямую,
    # поэтому base_url и слаг модели — под OpenRouter. Слаг сверен напрямую через
    # https://openrouter.ai/api/v1/models на 2026-09-20 (бесплатный тариф, 0$ prompt/completion).
    # Если упрёмся в rate-limit бесплатного тарифа на 750 запросах — переключить на
    # платный "qwen/qwen3.8-27b" (тот же provider/base_url, тот же ключ).
    base_url: https://openrouter.ai/api/v1
    model_name: qwen/qwen3.8-27b:free
    temperature: 0.7

runs_per_testcase: 50
