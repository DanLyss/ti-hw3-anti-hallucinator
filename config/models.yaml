# Конфигурация моделей для пайплайна. Ключи/секреты — в .env, не здесь.
models:
  chatgpt:
    provider: openai
    model_name: gpt-6
    temperature: 0.7
  deepseek:
    provider: deepseek
    model_name: deepseek-chat
    temperature: 0.7
  qwen:
    provider: qwen
    model_name: qwen-plus
    temperature: 0.7

runs_per_testcase: 50
