# Конфигурация моделей для пайплайна. Ключи/секреты — в .env, не здесь.
models:
  chatgpt:
    provider: openai
    model_name: gpt-6
    temperature: 0.7
  deepseek:
    provider: deepseek
    model_name: deepseek-chat
    temperature: 0.7
  gigachat:
    provider: gigachat
    model_name: GigaChat
    temperature: 0.7

runs_per_testcase: 50
